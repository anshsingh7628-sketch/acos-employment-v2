<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Aco's Employment</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&family=Instrument+Serif:ital@1&display=swap">
<style>
/* Layout: app shell — top bar with role switch, left rail per role, one working canvas.
   Tokens are V1's (docs/DESIGN-SYSTEM.md, 28 Sep 2026): dark-first, neutral greys, one blue accent.
   V2 adds semantic evidence + agent tokens mapped onto them (04_Experience/11_UX_Spec.md §1). */
:root {
  color-scheme: dark;
  --bg: #0A0A0B; --surface: #111113; --surface-2: #18181B; --raised: #1C1C20;
  --border: #232328; --border-strong: #2F2F35;
  --text: #FAFAFA; --muted: #A1A1AA; --subtle: #8A8A93;
  --accent: #7C9CFF; --accent-fg: #0A0A0B; --accent-soft: rgba(124,156,255,.12); --accent-line: rgba(124,156,255,.35);
  --success: #4ADE80; --success-soft: rgba(74,222,128,.12);
  --warn: #FBBF24; --warn-soft: rgba(251,191,36,.12);
  --danger: #F87171;
  --overlay: rgba(0,0,0,.6); --shadow: 0 12px 40px rgba(0,0,0,.45);
  --ev-strong: var(--success); --ev-strong-bg: var(--success-soft);
  --ev-some: var(--accent); --ev-some-bg: var(--accent-soft);
  --ev-thin: var(--warn); --ev-thin-bg: var(--warn-soft);
  --ev-unknown: var(--subtle); --ev-unknown-bg: var(--surface-2);
  --font-sans: "Geist", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "Geist Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --font-serif: "Instrument Serif", Georgia, "Times New Roman", serif;
  --r-sm: 8px; --r-md: 10px; --r-lg: 14px;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    color-scheme: light;
    --bg: #FFFFFF; --surface: #FAFAFA; --surface-2: #F4F4F5; --raised: #FFFFFF;
    --border: #E4E4E7; --border-strong: #D4D4D8;
    --text: #09090B; --muted: #52525B; --subtle: #6B6B74;
    --accent: #3355E0; --accent-fg: #FFFFFF; --accent-soft: rgba(51,85,224,.08); --accent-line: rgba(51,85,224,.3);
    --success: #15803D; --success-soft: rgba(21,128,61,.09);
    --warn: #B45309; --warn-soft: rgba(180,83,9,.09);
    --danger: #B91C1C; --overlay: rgba(9,9,11,.35); --shadow: 0 12px 40px rgba(9,9,11,.12);
  }
}
:root[data-theme="light"] {
  color-scheme: light;
  --bg: #FFFFFF; --surface: #FAFAFA; --surface-2: #F4F4F5; --raised: #FFFFFF;
  --border: #E4E4E7; --border-strong: #D4D4D8;
  --text: #09090B; --muted: #52525B; --subtle: #6B6B74;
  --accent: #3355E0; --accent-fg: #FFFFFF; --accent-soft: rgba(51,85,224,.08); --accent-line: rgba(51,85,224,.3);
  --success: #15803D; --success-soft: rgba(21,128,61,.09);
  --warn: #B45309; --warn-soft: rgba(180,83,9,.09);
  --danger: #B91C1C; --overlay: rgba(9,9,11,.35); --shadow: 0 12px 40px rgba(9,9,11,.12);
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.5 var(--font-sans); -webkit-font-smoothing: antialiased; }
button, input, textarea, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
.mono { font-family: var(--font-mono); }
.num { font-variant-numeric: tabular-nums; }
em.serif { font-family: var(--font-serif); font-style: italic; font-weight: 400; letter-spacing: 0; }

/* shell */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
  padding: 10px 20px; background: var(--bg); border-bottom: 1px solid var(--border); }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 600; letter-spacing: -.01em; }
.brand svg { flex: none; }
.brand small { font: 500 11px var(--font-mono); color: var(--subtle); text-transform: uppercase; letter-spacing: .08em; }
.roles { display: flex; gap: 2px; padding: 3px; background: var(--surface-2); border-radius: var(--r-md); }
.roles button { border: 0; background: transparent; padding: 6px 12px; border-radius: 7px; cursor: pointer; color: var(--muted); font-weight: 500; }
.roles button[aria-pressed="true"] { background: var(--raised); color: var(--text); box-shadow: 0 1px 0 var(--border-strong); }
.top .spacer { flex: 1; }
.iconbtn { border: 1px solid var(--border-strong); background: var(--raised); border-radius: var(--r-md); height: 34px; min-width: 34px; padding: 0 10px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; color: var(--muted); }
.iconbtn:hover { color: var(--text); }
.badge { background: var(--accent); color: var(--accent-fg); border-radius: 999px; font: 600 10px/1 var(--font-mono); padding: 3px 6px; }

.shell { display: grid; grid-template-columns: 220px minmax(0, 1fr); min-height: calc(100% - 56px); }
.rail { border-right: 1px solid var(--border); padding: 16px 12px; display: flex; flex-direction: column; gap: 2px; }
.rail .who { padding: 8px 10px 14px; border-bottom: 1px solid var(--border); margin-bottom: 8px; }
.rail .who b { display: block; font-weight: 600; }
.rail .who span { color: var(--subtle); font-size: 12px; }
.rail button { text-align: left; border: 0; background: transparent; padding: 8px 10px; border-radius: var(--r-sm); cursor: pointer; color: var(--muted); display: flex; justify-content: space-between; align-items: center; }
.rail button:hover { background: var(--surface-2); color: var(--text); }
.rail button[aria-current="page"] { background: var(--surface-2); color: var(--text); font-weight: 500; }
.rail .count { font: 500 11px var(--font-mono); color: var(--subtle); }
main { padding-block: 28px 64px; padding-inline: clamp(16px, 4vw, 40px); min-width: 0; }
.view { max-width: 1080px; display: flex; flex-direction: column; gap: 20px; }

.eyebrow { font: 500 11px var(--font-mono); text-transform: uppercase; letter-spacing: .08em; color: var(--subtle); }
h1 { font-size: 28px; line-height: 1.15; letter-spacing: -.02em; font-weight: 600; margin: 4px 0 0; text-wrap: balance; }
h2 { font-size: 16px; font-weight: 600; margin: 0; letter-spacing: -.01em; }
p { margin: 0; }
.lede { color: var(--muted); max-width: 64ch; margin-top: 8px; }
.row { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
.between { justify-content: space-between; }

.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-lg); padding: 18px; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.card.agent { background: linear-gradient(var(--accent-soft), var(--accent-soft)), var(--surface); border-color: var(--accent-line); }
.drafted { font: 500 11px var(--font-mono); color: var(--accent); display: inline-flex; gap: 6px; align-items: center; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(300px, 100%), 1fr)); gap: 14px; }
.grid3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(240px, 100%), 1fr)); gap: 14px; }

.btn { height: 36px; padding: 0 14px; border-radius: var(--r-md); border: 1px solid var(--border-strong); background: var(--raised); cursor: pointer; font-weight: 500; display: inline-flex; align-items: center; gap: 8px; }
.btn:hover { border-color: var(--subtle); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.ghost { border-color: transparent; background: transparent; color: var(--muted); }
.btn.ghost:hover { color: var(--text); background: var(--surface-2); }
.btn[disabled] { opacity: .5; cursor: not-allowed; }
.link { background: none; border: 0; padding: 0; color: var(--accent); cursor: pointer; font-weight: 500; }

/* evidence chips + fit rows */
.chip { display: inline-flex; align-items: center; gap: 6px; font: 500 11px/1 var(--font-mono); padding: 5px 8px; border-radius: 999px; white-space: nowrap; }
.chip::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.chip.strong { color: var(--ev-strong); background: var(--ev-strong-bg); }
.chip.some { color: var(--ev-some); background: var(--ev-some-bg); }
.chip.thin { color: var(--ev-thin); background: var(--ev-thin-bg); }
.chip.unknown { color: var(--ev-unknown); background: var(--ev-unknown-bg); }
.chip.unknown::before { background: transparent; border: 1px dashed currentColor; }
.chip.plain { color: var(--muted); background: var(--surface-2); }
.chip.wrap { white-space: normal; line-height: 1.35; border-radius: 8px; }
.chip.plain::before { display: none; }
.chip.lock { color: var(--text); background: var(--surface-2); }
.chip.lock::before { display: none; }

.fit { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px 12px; align-items: center; }
.fit .req { display: grid; grid-template-columns: 34px minmax(0, 1fr); align-items: baseline; min-width: 0; }
.fit .req b { font-weight: 500; }
.fit .req .meta { grid-column: 2; }
.must { width: 30px; flex: none; font: 500 10px var(--font-mono); color: var(--subtle); text-transform: uppercase; letter-spacing: .06em; }
.bar { height: 4px; background: var(--surface-2); border-radius: 4px; grid-column: 1 / -1; margin-top: -4px; overflow: hidden; }
.bar i { display: block; height: 100%; border-radius: 4px; }
.meta { color: var(--subtle); font-size: 12px; }
.kv { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px; }
.kv div { background: var(--surface-2); border-radius: var(--r-md); padding: 10px 12px; }
.kv small { display: block; font: 500 10px var(--font-mono); text-transform: uppercase; letter-spacing: .07em; color: var(--subtle); }
.kv b { font-weight: 600; font-variant-numeric: tabular-nums; }
.quote { background: var(--raised); border: 1px solid var(--border); border-radius: var(--r-md); padding: 12px 14px; color: var(--muted); white-space: pre-wrap; }
.risk { color: var(--warn); font-size: 13px; display: flex; gap: 8px; }
.risk::before { content: "△"; }
ul.clean { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }

/* board */
.board { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(200px, 1fr); gap: 12px; overflow-x: auto; padding-bottom: 8px; }
.col { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-lg); padding: 12px; display: flex; flex-direction: column; gap: 10px; min-height: 160px; }
.col h3 { margin: 0; font: 500 11px var(--font-mono); text-transform: uppercase; letter-spacing: .08em; color: var(--subtle); display: flex; justify-content: space-between; }
.col h3.post { color: var(--accent); }
.mini { background: var(--raised); border: 1px solid var(--border); border-radius: var(--r-md); padding: 10px; display: flex; flex-direction: column; gap: 4px; }
.mini b { font-weight: 500; }

/* timeline */
.tl { display: flex; flex-direction: column; }
.tl .item { display: grid; grid-template-columns: 90px 28px minmax(0, 1fr); gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--border); align-items: start; }
.tl time { font: 12px var(--font-mono); color: var(--subtle); padding-top: 4px; }
.dot { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; font: 600 11px var(--font-mono); background: var(--surface-2); color: var(--muted); }
.dot.agent { background: var(--accent-soft); color: var(--accent); }
.dot.ev { background: var(--success-soft); color: var(--success); }

/* automation */
.dial { display: flex; gap: 2px; padding: 3px; background: var(--surface-2); border-radius: var(--r-md); flex-wrap: wrap; }
.dial button { border: 0; background: transparent; padding: 6px 10px; border-radius: 7px; cursor: pointer; color: var(--muted); font-size: 13px; }
.dial button[aria-pressed="true"] { background: var(--raised); color: var(--text); box-shadow: 0 1px 0 var(--border-strong); }
.dial button[disabled] { opacity: .35; cursor: not-allowed; }
.auto-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 14px 0; border-bottom: 1px solid var(--border); }
.auto-row:last-child { border-bottom: 0; }

/* table */
.tablewrap { overflow-x: auto; border: 1px solid var(--border); border-radius: var(--r-lg); }
table { border-collapse: collapse; width: 100%; min-width: 560px; }
th, td { text-align: left; padding: 10px 14px; border-bottom: 1px solid var(--border); font-variant-numeric: tabular-nums; }
th { font: 500 11px var(--font-mono); text-transform: uppercase; letter-spacing: .07em; color: var(--subtle); background: var(--surface); }
tr:last-child td { border-bottom: 0; }
td.r, th.r { text-align: right; }

textarea { width: 100%; min-height: 110px; resize: vertical; background: var(--raised); border: 1px solid var(--border-strong); border-radius: var(--r-md); padding: 12px; line-height: 1.5; }
.field { display: flex; flex-direction: column; gap: 6px; }
.field label { font: 500 11px var(--font-mono); text-transform: uppercase; letter-spacing: .07em; color: var(--subtle); }
.field .val { padding: 9px 12px; border-radius: var(--r-md); border: 1px solid var(--border-strong); background: var(--raised); }
.field.ai .val { border-color: var(--accent-line); background: linear-gradient(var(--accent-soft), var(--accent-soft)), var(--raised); }

/* dialog + toast */
dialog { border: 1px solid var(--border-strong); background: var(--raised); color: var(--text); border-radius: var(--r-lg); padding: 0; width: min(620px, calc(100vw - 32px)); box-shadow: var(--shadow); }
dialog::backdrop { background: var(--overlay); }
dialog header { display: flex; justify-content: space-between; align-items: center; padding: 16px 18px; border-bottom: 1px solid var(--border); }
dialog .body { padding: 18px; display: flex; flex-direction: column; gap: 14px; max-height: 70vh; overflow: auto; }
.step { display: grid; grid-template-columns: 24px minmax(0, 1fr); gap: 10px; }
.step .n { font: 500 11px var(--font-mono); color: var(--subtle); padding-top: 2px; }
.toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--raised); border: 1px solid var(--border-strong); border-radius: var(--r-md); padding: 10px 12px 10px 16px; display: flex; gap: 14px; align-items: center; box-shadow: var(--shadow); z-index: 50; max-width: calc(100vw - 32px); }
.toast .t { font: 500 12px var(--font-mono); color: var(--subtle); }

.note { font-size: 12px; color: var(--subtle); border-top: 1px dashed var(--border-strong); padding-top: 12px; }
.pill-state { font: 500 11px var(--font-mono); padding: 3px 8px; border-radius: 6px; background: var(--surface-2); color: var(--muted); }
.bands { display: flex; flex-direction: column; gap: 8px; }
.band { display: grid; grid-template-columns: 110px minmax(0, 1fr) 36px; gap: 10px; align-items: center; font-size: 13px; }
.band .track { height: 10px; background: var(--surface-2); border-radius: 5px; overflow: hidden; }
.band .track i { display: block; height: 100%; background: var(--accent); border-radius: 5px; }

@media (max-width: 760px) {
  .shell { grid-template-columns: minmax(0, 1fr); }
  .rail { flex-direction: row; overflow-x: auto; border-right: 0; border-bottom: 1px solid var(--border); padding: 8px 12px; }
  .rail .who { display: none; }
  .rail button { white-space: nowrap; }
  .top { padding: 10px 16px; }
  .tl .item { grid-template-columns: 28px minmax(0, 1fr); }
  .tl time { grid-column: 2; padding: 0; order: 2; }
  h1 { font-size: 24px; }
}
@media (prefers-reduced-motion: no-preference) {
  .card, .mini { transition: border-color .15s, transform .15s; }
  .view { animation: in .22s ease-out; }
  @keyframes in { from { transform: translateY(4px); } to { transform: none; } }
}
</style>

<header class="top">
  <div class="brand">
    <svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 19h5v-5h5V9h5V4h3" fill="none" stroke="var(--accent)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <span>Aco's Employment</span><small>Live</small>
  </div>
  <div class="roles" role="group" aria-label="View as">
    <button type="button" data-role="seeker" aria-pressed="true">Job seeker</button>
    <button type="button" data-role="recruiter" aria-pressed="false">Employer</button>
    <button type="button" data-role="institution" aria-pressed="false">Institution</button>
  </div>
  <div class="spacer"></div>
  <button class="iconbtn" type="button" id="bell" aria-label="Notifications"><svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 16V11a6 6 0 1 1 12 0v5l2 2H4zM10 20a2 2 0 0 0 4 0" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg><span class="badge" id="bellCount">3</span></button>
  <button class="iconbtn" type="button" id="theme" aria-label="Switch theme">Theme</button>
</header>

<div class="shell">
  <nav class="rail" id="rail" aria-label="Sections"></nav>
  <main id="main"></main>
</div>

<dialog id="trace" aria-labelledby="traceTitle">
  <header><h2 id="traceTitle">Why this happened</h2><button class="btn ghost" type="button" id="traceClose">Close</button></header>
  <div class="body" id="traceBody"></div>
</dialog>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<script>
let DATA = null;

// ---------- helpers ----------
const $ = (s, el = document) => el.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const inr = (n) => "₹" + Math.round(n).toLocaleString("en-IN");
const LABEL = { strong: "Strong evidence", some: "Some evidence", thin: "Thin evidence", unknown: "No evidence yet" };
const CLASS_TXT = { claim: "claim", credential: "credential", practice_assessment: "practice", assessment: "assessment", work_artifact: "work artifact", observed_outcome: "observed outcome", verified_outcome: "verified outcome" };
const CAP_TXT = { market_research: "Market research", crm_admin: "CRM setup & admin", b2b_outreach_writing: "B2B outreach writing", data_cleaning: "Data cleaning", excel_modelling: "Excel modelling", sql: "SQL", stakeholder_comms: "Stakeholder communication", python: "Python" };
const capName = (c) => CAP_TXT[c] || c;
const chip = (label, extra = "") => `<span class="chip ${label}">${LABEL[label]}${extra}</span>`;
const barColor = { strong: "var(--ev-strong)", some: "var(--ev-some)", thin: "var(--ev-thin)", unknown: "transparent" };

function fitRows(rows) {
  return `<div class="fit">${rows.map((r) => `
    <div class="req">${r.must ? '<span class="must">must</span>' : '<span class="must">nice</span>'}<b>${esc(capName(r.requirement))}</b>
      ${r.bestClass ? `<span class="meta">${CLASS_TXT[r.bestClass]}${r.recencyMonths != null ? `, ${r.recencyMonths} mo` : ""}</span>` : ""}</div>
    ${chip(r.label)}
    <div class="bar" aria-hidden="true"><i style="width:${r.coverage == null ? 0 : Math.round(r.coverage * 100)}%;background:${barColor[r.label]}"></i></div>`).join("")}</div>`;
}

let toastTimer = null;
function toast(msg, { undoSeconds = 0, onUndo } = {}) {
  const t = $("#toast");
  clearInterval(toastTimer);
  let left = undoSeconds;
  const draw = () => {
    const mm = String(Math.floor(left / 60)).padStart(2, "0"), ss = String(left % 60).padStart(2, "0");
    t.innerHTML = `<span>${esc(msg)}</span>${undoSeconds ? `<span class="t">${mm}:${ss}</span><button class="btn" type="button" id="undoBtn">Undo</button>` : ""}<button class="btn ghost" type="button" id="toastX" aria-label="Dismiss">✕</button>`;
    if (undoSeconds) $("#undoBtn").onclick = () => { clearInterval(toastTimer); t.hidden = true; onUndo && onUndo(); };
    $("#toastX").onclick = () => { clearInterval(toastTimer); t.hidden = true; };
  };
  t.hidden = false; draw();
  if (undoSeconds) toastTimer = setInterval(() => { left--; if (left <= 0) { clearInterval(toastTimer); t.hidden = true; } else draw(); }, 1000);
}

function openTrace(tr) {
  $("#traceTitle").textContent = tr.title;
  $("#traceBody").innerHTML = `
    <div class="kv">
      <div><small>Agent</small><b>${esc(tr.agent)}</b></div>
      <div><small>Policy</small><b>${esc(tr.policy)}</b></div>
      <div><small>Cost</small><b class="num">${esc(tr.cost)}</b></div>
      <div><small>Model tier</small><b>${esc(tr.model)}</b></div>
    </div>
    ${tr.steps.map((s, i) => `<div class="step"><span class="n">${i + 1}</span><div><b>${esc(s[0])}</b><p class="meta">${esc(s[1])}</p></div></div>`).join("")}
    <p class="note">Every agent action keeps this record: inputs used, evidence ids, the policy decision that allowed it, the model and what it cost. Nothing an agent does happens without one.</p>`;
  $("#trace").showModal();
}
$("#traceClose").onclick = () => $("#trace").close();

// ---------- state ----------
const S = {
  role: "seeker",
  view: { seeker: "home", recruiter: "configs", institution: "cohort" },
  approved: new Set(), skipped: new Set(),
  dial: { apply_native: 3, apply_external: 3, followups: 2, schedule: 3, reject: 6 },
  paused: false,
  demandDrafted: false,
  chosen: null,
  disclosure: { all_recruiters: false, institution: true },
};

// ---------- seeker ----------

  return `<div class="view">
    <div><div class="eyebrow">Placement report · 2026–27 season to date</div><h1>The number you're <em class="serif">judged</em> on</h1>
      <p class="lede">Students who opted out (higher studies, family business, not participating) stay out of the denominator, the same way V1 already counts them.</p></div>
    <div class="grid3">
      <div class="kv"><div><small>Placement rate</small><b class="num">${Math.round((placed / (placed + notPlaced)) * 100)}%</b></div></div>
      <div class="kv"><div><small>Placed / seeking</small><b class="num">${placed} / ${placed + notPlaced}</b></div></div>
      <div class="kv"><div><small>Opted out</small><b class="num">${opted}</b></div></div>
    </div>
    <div class="card"><h2>Offers by CTC band</h2><div class="bands">${bands.map(([l, n]) => `<div class="band"><span>${l}</span><span class="track"><i style="width:${max ? (n / max) * 100 : 0}%"></i></span><span class="num">${n}</span></div>`).join("")}</div></div>
    <div class="card"><h2>New in V2: project outcomes</h2><p class="meta">14 students finished supervised projects with partner SMEs this term. 11 have verified outcomes on their passports — evidence the next employer can check.</p></div>
  </div>`;
}

// ---------- traces ----------
const TRACES = {
  a1: { title: "Why Aco prepared this", agent: "Discovery → Application", policy: "Prepare (L2) · send needs you", cost: "₹3.40", model: "small + mid",
    steps: [["Matched your intent", "Growth / analyst · internship or full-time · ₹3–6 LPA · Bengaluru or remote"], ["Compared requirements with your passport", "2 must-haves with some evidence, 1 nice-to-have unknown"], ["Picked Resume v3", "Highest overlap with this posting; nothing added that isn't already in your resume"], ["Drafted the note", "Cites one attested artifact; no claims beyond your passport (checked)"]] },
  a2: { title: "Why Aco prepared this", agent: "Discovery → Application", policy: "Prepare (L2)", cost: "₹3.10", model: "small + mid", steps: [["Matched your analyst intent", "Remote, ₹4.5–5.5 LPA"], ["SQL is thin", "Flagged as a gap, not hidden"]] },
  a3: { title: "Why this is a handoff", agent: "Application", policy: "Capped at Ask me (L3) for external sites", cost: "₹2.20", model: "small", steps: [["External site", "Automated submission breaks most job sites' terms"], ["Materials copied", "You submit on their site, then tap 'I submitted'"]] },
  prep: { title: "Overnight run", agent: "Discovery + Application", policy: "Prepare only", cost: "₹9.80", model: "small", steps: [["Checked 214 new openings", "Normalised once per posting and cached"], ["Filtered by your hard limits", "Location, band, mode, already applied"], ["Prepared the top 3", "Waiting in Ready for you"]] },
  follow: { title: "Follow-up to Brightwell", agent: "Coordination", policy: "Do it (L4) · your standing permission", cost: "₹0.40", model: "small", steps: [["5 business days, no reply", "Rule: at most two follow-ups"], ["Template-bound, existing thread", "Both checks passed, so it went without asking"]] },
  demand: { title: "Why these fields", agent: "Demand", policy: "Prepare (L2) · publishing is yours", cost: "₹2.70", model: "mid", steps: [["Read your paragraph", "Nothing else from outside your account was used"], ["Split the work", "Four pieces, each with something that proves it's done"], ["Left budget as you said it", "Aco never invents budget or location"]] },
  compiler: { title: "How these options were built", agent: "Allocation (compiler)", policy: "Recommend (L1)", cost: "₹0 — no model", model: "deterministic", steps: [["Started from consented supply", "People who agreed to be shown to you or your partner college"], ["Applied hard limits first", "Availability window, location, free hours, budget"], ["Built five kinds of configuration", "Kept only options not beaten on every axis"], ["Stored the run", "So the prediction can be compared with the outcome later"]] },
  outcome: { title: "How the outcome was drafted", agent: "Outcome", policy: "Draft (L2) · confirm is yours", cost: "₹1.60", model: "mid", steps: [["Read success criteria", "≥ 300 qualified leads"], ["Read linked evidence", "CRM export (verified), sequences (attested)"], ["Named a confounder", "Founder outreach in weeks 6–8 → medium attribution"]] },
};

// ---------- nav + render ----------
const NAV = {
  seeker: { who: ["Priya Nair", "B.Tech CSE · final year"], items: [["home", "Ready for you", () => PREPARED.filter((p) => !S.approved.has(p.id) && !S.skipped.has(p.id)).length], ["board", "Engagements"], ["passport", "Passport"], ["timeline", "Timeline"], ["auto", "Automation"]] },
  recruiter: { who: ["Meera Iyer", "Founder · Kesar Foods"], items: [["demand", "New demand"], ["configs", "Configurations"], ["pipeline", "Pipeline"], ["decision", "Decision card"], ["outcome", "Outcome"]] },
  institution: { who: ["Dr. Kavita Rao", "Placement officer · Demo College"], items: [["cohort", "Cohort map"], ["report", "Placement report"]] },
};
const VIEWS = { home: seekerHome, board: seekerBoard, passport: seekerPassport, timeline: seekerTimeline, auto: seekerAuto,
  demand: recruiterDemand, configs: recruiterConfigs, pipeline: recruiterPipeline, decision: recruiterDecision, outcome: recruiterOutcome,
  cohort: instCohort, report: instReport };

function render() {
  const nav = NAV[S.role];
  const cur = S.view[S.role];
  $("#rail").innerHTML = `<div class="who"><b>${esc(nav.who[0])}</b><span>${esc(nav.who[1])}</span></div>` +
    nav.items.map(([id, label, count]) => `<button type="button" data-nav="${id}" ${cur === id ? 'aria-current="page"' : ""}><span>${label}</span>${count ? `<span class="count">${count()}</span>` : ""}</button>`).join("");
  $("#main").innerHTML = VIEWS[cur]();
  document.querySelectorAll(".roles button").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.role === S.role)));
  const pending = PREPARED.filter((p) => !S.approved.has(p.id) && !S.skipped.has(p.id)).length;
  $("#bellCount").textContent = String(pending);
  $("#bellCount").hidden = pending === 0;
}

document.addEventListener("click", (e) => {
  const t = e.target.closest("button");
  if (!t) return;
  const d = t.dataset;
  if (d.role) { S.role = d.role; render(); return; }
  if (d.nav) { S.view[S.role] = d.nav; render(); window.scrollTo(0, 0); return; }
  if (d.go) { S.view[S.role] = d.go; render(); window.scrollTo(0, 0); return; }
  if (d.why) { openTrace(TRACES[d.why] || TRACES.prep); return; }
  if (d.approve) {
    const p = PREPARED.find((x) => x.id === d.approve);
    S.approved.add(p.id); render();
    if (p.channel === "native") toast(`Sent to ${p.org}`, { undoSeconds: 30 * 60, onUndo: () => { S.approved.delete(p.id); render(); toast("Withdrawn before the employer saw it"); } });
    else toast("Opened with your materials. Tap “I submitted” on the page when done.");
    return;
  }
  if (d.skip) { S.skipped.add(d.skip); render(); toast("Skipped. Aco won't suggest this one again."); return; }
  if (d.dial) { S.dial[d.dial] = Number(d.v); render(); toast(`Set to “${LEVELS[Number(d.v)]}”`); return; }
  if (d.disc) { S.disclosure[d.disc] = d.v === "1"; render(); toast(d.v === "1" ? "Visible. You can hide it again any time." : "Hidden. Removed from search within a minute."); return; }
  if (d.revoke !== undefined) { t.closest(".auto-row").remove(); toast("Permission revoked. Runs in progress stop at their next step."); return; }
  if (d.choose) { S.chosen = d.choose; render(); toast("Chosen. Soft holds placed on everyone's time for 72 hours."); return; }
  if (d.gap) { toast("Opened the cohort project brief"); return; }
  if (t.id === "pauseAll") { S.paused = !S.paused; render(); toast(S.paused ? "All automation paused" : "Automation resumed"); return; }
  if (t.id === "draftBtn") { S.demandDrafted = true; render(); return; }
  if (t.id === "sendOffer") { toast("Offer sent by you. Both people need to accept before work starts."); return; }
  if (t.id === "draftReject") { toast("Decline drafted with reasons. Review and send it yourself."); return; }
  if (t.id === "confirmOutcome") { toast("Outcome recorded. Passports updated; the compiler's prediction is logged against it."); return; }
  if (t.id === "consentDrive") { toast("Consent request sent to 61 students in English and Hindi"); return; }
  if (t.id === "bell") { S.role = "seeker"; S.view.seeker = "home"; render(); return; }
  if (t.id === "theme") {
    const r = document.documentElement;
    const now = r.dataset.theme || (matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
    r.dataset.theme = now === "dark" ? "light" : "dark";
    try { localStorage.setItem("aco-v2-theme", r.dataset.theme); } catch (_) {}
  }
});

try { const th = localStorage.getItem("aco-v2-theme"); if (th) document.documentElement.dataset.theme = th; } catch (_) {}
async function boot() {
  const main = document.getElementById("main");
  main.innerHTML = '<div class="view"><div class="eyebrow">Aco\'s Employment</div><h1>Loading the <em class="serif">live</em> compiler</h1><p class="lede">Staffing options are computed on the server from the reference kernel, not from a baked screenshot.</p></div>';
  try {
    const res = await fetch("/api/compile", { headers: { "accept": "application/json" } });
    if (!res.ok) throw new Error("compile " + res.status);
    DATA = await res.json();
    render();
  } catch (err) {
    main.innerHTML = '<div class="view"><h1>Compiler unavailable</h1><p class="lede">' + esc(err.message) + '</p></div>';
  }
}
boot();
</script>

</body></html>
